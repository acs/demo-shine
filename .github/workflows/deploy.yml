name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # the version bump and its tag are committed back to main
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUSKY: 0
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          # The MCP server is published from the same merge; the token below is what
          # lets `npm publish` in mcp/ authenticate.
          registry-url: https://registry.npmjs.org

      # Every merge to main is a new version: the patch is bumped, the bump is
      # pushed back and tagged `vX.Y.Z`, and the build below bakes that number
      # into the app — so the tag, main's package.json and the number beside the
      # logo all agree. A push made with GITHUB_TOKEN does not start another run,
      # and `[skip ci]` says so as well. Bump the minor or major by hand before
      # merging when a release deserves it: see VERSIONING.md.
      #
      # The MCP server carries the same number, because a clip's written shape is a
      # contract between the two: CI owns it, and stamps both in this one commit so
      # they cannot drift.
      - name: Bump the version and tag it
        id: version
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          npm version patch --no-git-tag-version
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          npm --prefix mcp run sync-version
          npm --prefix mcp install --package-lock-only --no-audit --no-fund
          git add package.json package-lock.json mcp/package.json mcp/package-lock.json
          git commit -m "chore: bump version to v$VERSION [skip ci]"
          git tag "v$VERSION"
          git push --atomic origin HEAD:main "v$VERSION"

      - run: npm ci
      - run: npm run build

      # The server ships the app's own build inside it, which is what makes "the two
      # agree on how a clip is written down" true by construction rather than a
      # promise. No token is a skip, not a failure: the version was still stamped.
      - name: Publish the MCP server
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "No NPM_TOKEN secret is set — the version was stamped and the server built, but nothing was published."
            exit 0
          fi
          # The server's own dependencies, before anything is built with them: `tsc`
          # needs the type definitions the package declares, and a release never
          # installed them — which is exactly how the first run of this step failed.
          # Playwright's browser download is skipped: a release compiles and packs,
          # and it is the person's own install that needs a browser.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm --prefix mcp ci
          npm --prefix mcp run bundle-app
          npm --prefix mcp run build
          cd mcp && npm publish --access public

      - uses: actions/configure-pages@v6
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

      - name: Report the deployed version
        run: echo "Deployed DemoClip v${{ needs.build.outputs.version }} — ${{ steps.deployment.outputs.page_url }}"
